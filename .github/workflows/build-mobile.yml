name: Build Community Chat mobile apps
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'app-icon.svg'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'music/**'
      - '.github/workflows/build-mobile.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's Ubuntu runner already provides the Android SDK.
      # Avoid setup-android's sdkmanager bootstrap, which can fail before the build.
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms" || { echo 'Android SDK platforms not found'; exit 1; }
          test -d "${ANDROID_HOME}/build-tools" || { echo 'Android SDK build tools not found'; exit 1; }
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npm run native:android
      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: community-chat-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate iOS Xcode project
        working-directory: mobile
        run: npm run native:ios
      - name: Build iOS simulator app (unsigned)
        working-directory: mobile/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: community-chat-ios-simulator-app-unsigned
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
      - name: Build unsigned iOS device app
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned device IPA
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "::error::Physical-device App.app not found"; exit 1; }
          mkdir -p ipa/Payload
          ditto "$APP" ipa/Payload/App.app
          (cd ipa && zip -qry ../community-chat-unsigned.ipa Payload)
          unzip -t community-chat-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: community-chat-ios-device-ipa-unsigned
          path: mobile/ios/App/community-chat-unsigned.ipa
          if-no-files-found: error

  publish-release-assets:
    name: Attach APK and unsigned IPA to GitHub Release
    if: github.event_name == 'release'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: community-chat-android-debug-apk
          path: dist/android
      - name: Download iOS device build
        uses: actions/download-artifact@v4
        with:
          name: community-chat-ios-device-ipa-unsigned
          path: dist/ios
      - name: Rename files for release
        run: |
          set -euo pipefail
          mv dist/android/app-debug.apk dist/android/community-chat-android-debug.apk
          test -s dist/android/community-chat-android-debug.apk
          test -s dist/ios/community-chat-unsigned.ipa
      - name: Upload to the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/android/community-chat-android-debug.apk \
            dist/ios/community-chat-unsigned.ipa --clobber
