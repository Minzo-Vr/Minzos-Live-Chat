name: Build Community Chat mobile apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'app-icon.svg'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'music/**'
      - '.github/workflows/build-mobile.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npm run native:android
      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: community-chat-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate iOS Xcode project
        working-directory: mobile
        run: npm run native:ios
      - name: Build iOS simulator app (unsigned)
        working-directory: mobile/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: community-chat-ios-simulator-app-unsigned
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
