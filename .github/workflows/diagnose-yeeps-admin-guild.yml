name: Diagnose Yeeps Admin Guild

on:
  push:
    branches: [main]
    paths:
      - "yeeps-card-bot/check-admin-guild.mjs"
      - ".github/workflows/diagnose-yeeps-admin-guild.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check new Yeeps bot guilds
        env:
          YEEPS_DISCORD_BOT_TOKEN: ${{ secrets.YEEPS_DISCORD_BOT_TOKEN }}
        run: node yeeps-card-bot/check-admin-guild.mjs
