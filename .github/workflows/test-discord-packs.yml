name: Test Yeeps Discord Pack Opener

on:
  push:
    branches: [main]
    paths:
      - "discord-bot/yeeps-packs.js"
      - "discord-bot/yeeps-packs.test.mjs"
      - "discord-bot/worker.js"
      - ".github/workflows/test-discord-packs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check bot syntax
        run: |
          node --check discord-bot/yeeps-packs.js
          node --check discord-bot/worker.js
      - name: Test pack opening, reveal and collections
        run: node --test discord-bot/yeeps-packs.test.mjs
