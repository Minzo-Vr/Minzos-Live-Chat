name: Register Discord Slash Commands

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "discord-bot/register-commands.mjs"
      - ".github/workflows/register-discord-commands.yml"

permissions:
  contents: read

jobs:
  register:
    name: Register guild commands
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required configuration
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: |
          test -n "$DISCORD_BOT_TOKEN" || { echo "::error::Missing repository secret DISCORD_BOT_TOKEN"; exit 1; }
          test -n "$DISCORD_APPLICATION_ID" || { echo "::error::Missing repository variable DISCORD_APPLICATION_ID"; exit 1; }
          test -n "$DISCORD_GUILD_ID" || { echo "::error::Missing repository variable DISCORD_GUILD_ID"; exit 1; }
      - name: Register commands
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: node discord-bot/register-commands.mjs
